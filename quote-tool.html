<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quote Tool – Wiz Insurance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #f4f6f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #0d1f3c;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 32px rgba(13,31,60,0.10);
  }
  .logo { margin-bottom: 28px; }
  .logo img { height: 44px; }
  .icon {
    width: 64px; height: 64px;
    background: #eef2f8;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #0d1f3c; }
  .subtitle { font-size: 14.5px; color: #6b7280; line-height: 1.6; margin-bottom: 32px; }
  .divider { border: none; border-top: 1px solid #eef0f4; margin-bottom: 28px; }
  .cta-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9ca3af; margin-bottom: 14px; }
  .contact-box {
    background: #f4f6f9;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .contact-name { font-size: 16px; font-weight: 700; color: #0d1f3c; margin-bottom: 6px; }
  .contact-phone {
    display: inline-block;
    font-size: 22px; font-weight: 700; color: #0d1f3c;
    text-decoration: none;
    margin-bottom: 6px;
  }
  .contact-phone:hover { color: #E63946; }
  .contact-email {
    display: block; font-size: 13px; color: #6b7280; text-decoration: none;
  }
  .contact-email:hover { text-decoration: underline; }
  .back-link {
    display: inline-block; margin-top: 24px;
    font-size: 13px; color: #6b7280; text-decoration: none;
  }
  .back-link:hover { color: #0d1f3c; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="https://www.wizinsurance.ca/assets/wiz-logo.png" alt="Wiz Insurance" onerror="this.style.display='none'"/>
    </div>
    <div class="icon">🛠️</div>
    <h1>Quote Tool Updating</h1>
    <p class="subtitle">We're making improvements to our online quote tool.<br/>It will be back shortly.</p>
    <hr class="divider"/>
    <div class="cta-label">Get a quote now — call or email</div>
    <div class="contact-box">
      <div class="contact-name">Shivang Goyal</div>
      <a href="tel:6479955891" class="contact-phone">(647) 995-5891</a>
      <a href="mailto:shivang@wizinsurance.ca" class="contact-email">shivang@wizinsurance.ca</a>
    </div>
    <a href="https://www.wizinsurance.ca" class="back-link">← Back to Wiz Insurance</a>
  </div>
</body>
</html>
